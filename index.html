<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Dash</title>
<style>
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9ad7ff; color: #fffefa;
    font-family: system-ui, sans-serif; touch-action: none; }
  canvas { display: block; }

  /* start.ng player card (from the start.ng docs) */
  .startng-card { position: fixed; top: 16px; left: 16px; display: flex; align-items: center; gap: 12px;
    padding: 8px 16px 8px 8px; border-radius: 999px; background: #292a23; color: #fffefa; }
  .startng-card img { width: 48px; height: 48px; border-radius: 50%; background: #d8fd71; }
  .startng-card b { display: block; font-size: 16px; }
  .startng-card span { font-size: 12px; opacity: .7; }

  #hud { position: fixed; top: 16px; right: 16px; padding: 10px 18px; border-radius: 999px;
    background: #292a23; font-weight: 700; font-size: 18px; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .45); }
  .panel { background: #292a23; border-radius: 16px; padding: 24px; width: min(340px, 84%); text-align: center; }
  .panel h1 { margin: 0 0 8px; font-size: 32px; color: #d8fd71; }
  .panel p { margin: 6px 0; line-height: 1.4; }
  .panel ol { text-align: left; margin: 12px 0; padding-left: 28px; }
  .btn { display: inline-block; margin-top: 12px; border: 0; border-radius: 999px; padding: 10px 22px;
    background: #d8fd71; color: #292a23; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; }
  .btn:focus-visible { outline: 3px solid #fffefa; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="startng-card" id="player-card" hidden>
    <img id="player-face" alt="">
    <div><b id="player-name"></b><span id="player-account"></span></div>
  </div>
  <div id="hud" hidden>Coins <span id="coins">0</span> &nbsp; Time <span id="time">45</span></div>

  <div id="overlay">
    <div class="panel">
      <h1 id="title">Coin Dash</h1>
      <p id="info">Collect as many coins as you can in 45 seconds. Move with the arrow keys or WASD. On a phone, press and hold where you want to go.</p>
      <p id="result"></p>
      <ol id="board"></ol>
      <button class="btn" id="play">Play</button><br>
      <a class="btn" id="signin" hidden>Sign in to save your score</a>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
